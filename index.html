const FACTS_HE=['ב-24 במאי 1844 שלח סמואל מורס את המסר "מה עשה האל" מוושינגטון לבולטימור, ופתח את קו הטלגרף הראשון למרחקים ארוכים.','לפני שהמציא את הטלגרף, סמואל מורס היה צייר פורטרטים מצליח.','אלפרד ויל, שותפו של מורס, עזר לעצב את האלפבית של נקודות וקווים, ונתן לאותיות נפוצות כמו E את הקודים הקצרים ביותר.','מסר ההדגמה המוקדם מ-1838 היה: "מי שממתין בסבלנות לא מפסיד".','מורס קיבל ב-1840 את פטנט אמריקאי מספר 1,647 על הטלגרף שלו.','קוד מורס הבינלאומי, שתוקנן ב-1865, התפתח מגרסה מפושטת של פרידריך גרקה ששימשה ברכבות בגרמניה.','SOS אומץ בכנס הרדיו בברלין ב-1906. זה לא ראשי תיבות של שום דבר; הרצף פשוט היה קל לשליחה ולזיהוי.','לפני SOS ספינות שלחו לרוב CQD. הטיטניק השתמשה בשניהם באפריל 1912.','מפעיל הרדיו של הטיטניק, ג׳ק פיליפס, המשיך לשלוח קריאות מצוקה עד שהחשמל נפסק. הספינה קרפטיה הצילה כ-700 איש.','ב-12 בדצמבר 1901 קלט מרקוני את האות S, שלוש נקודות, מעבר לאוקיינוס האטלנטי, מקורנוול לניופאונדלנד.','כבל הטלגרף הראשון חוצה האוקיינוס ב-1858 נשא את ברכת המלכה ויקטוריה לנשיא בוקנן. שליחתה ארכה יותר מ-16 שעות.','המילה PARIS קובעת את מדידת המילים לדקה, כי שליחתה אורכת בדיוק 50 יחידות זמן.','התזמון במורס פשוט: קו נמשך שלוש נקודות, והרווח בין אותיות נמשך שלוש נקודות.','ב-1939 העתיק טד מקלרוי מורס במהירות 75.2 מילים לדקה, שיא מפורסם.','לכל מפעיל טלגרף הייתה "אגרוף" אישית, קצב שליחה כה ייחודי שמפעילים אחרים זיהו אותו.','במלחמת העולם השנייה יירטו עמדות האזנה של בעלות הברית כמויות עצומות של הודעות מורס ממפעילי רדיו גרמנים.','מכונות אניגמה ערבבו את האותיות, אבל הטקסט המוצפן עדיין נשלח ברדיו בקוד מורס רגיל.','במלחמת העולם השנייה למדו מפעילי רדיו לזהות תחנות אויב לפי האגרוף שלהן, מה שעזר לעקוב אחר יחידות גם כשההודעות נשארו בלתי קריאות.','סוכני המחתרת שהכשיר ה-SOE הבריטי החביאו בשידורי המורס שלהם בדיקות אבטחה סודיות שהראו אם נתפסו.','ה-BBC השתמש באות V במורס, נקודה-נקודה-נקודה-קו, כאות ניצחון במלחמת העולם השנייה. היא מהדהדת את הצלילים הראשונים של הסימפוניה החמישית של בטהובן.','ב-1966 מצמץ השבוי ג׳רמיה דנטון את המילה TORTURE בקוד מורס במהלך ראיון בטלוויזיה הצפון-וייטנאמית.','מברק צימרמן מ-1917 יורט ופוענח על ידי מפצחי צפנים בריטים, ועזר להכניס את ארצות הברית למלחמת העולם הראשונה.','ספינות מלחמה עדיין משתמשות במנורות מהבהבות לשליחת מורס כשנדרשת שתיקת רדיו.','משואות ניווט של מטוסים מזדהות באותיות מורס, כדי שהטייסים יוכלו לוודא שכיוונו לתחנה הנכונה.','קו הטלגרף האמריקאי הגיע לקליפורניה באוקטובר 1861, וה"פוני אקספרס" נסגר ימים ספורים אחר כך.','קיצורי הטלגרף חיים עד היום: מפעילים השתמשו ב-73 במשמעות "ד״ש" וב-88 במשמעות "אהבה ונשיקות".','חובבי רדיו שיגרו אותות מורס אל הירח וקיבלו בחזרה את ההד של עצמם.','ארצות הברית ביטלה ב-2007 את מבחן המורס לרישיון חובבי רדיו.','ב-1999 החליפה מערכת GMDSS מבוססת לוויינים את המורס כדרך העיקרית של ספינות לקרוא לעזרה.','ווסטרן יוניון שלחה את המברק האחרון שלה ב-27 בינואר 2006.','הודו סגרה ב-2013 את שירות המברקים שלה אחרי יותר מ-160 שנה.','אפשר להקיש מורס על כף היד, וחלק מהחירשים-עיוורים משתמשים בו כדי לתקשר במגע.','גוגל הוסיפה ב-2018 מקלדת קוד מורס ל-Gboard, שנבנתה מתוך מחשבה על נגישות.','הטלגרף של מורס נשען על עבודת האלקטרומגנטים של המדען ג׳וזף הנרי.','אפשר לשלוח מורס באור, בצליל, ברדיו או בהקשה, כך שקוד אחד עובד כמעט עם כל אות.','קוק וויטסטון בנו טלגרף מחוגים מוקדם בבריטניה ב-1837, שנים לפני שהשיטה של מורס התפשטה.','בשפות רבות יש אלפבית מורס משלהן, כולל עברית.','בקוד מורס האות E היא נקודה אחת, האות הקצרה ביותר, כי היא הנפוצה ביותר באנגלית.','מפעיל מיומן "מעתיק" מורס לפי השמיעה, ושומע אותיות שלמות כקצבים במקום לספור נקודות וקווים.','מורס היה הקוד הדיגיטלי הראשון שנהג באופן רחב: כל הודעה בנויה רק מאותות של דלוק וכבוי.'];

const FACTS=['On May 24, 1844, Samuel Morse sent "What hath God wrought" from Washington to Baltimore, opening the first long-distance telegraph line.','Before inventing the telegraph, Samuel Morse was a successful portrait painter.',"Alfred Vail, Morse's partner, helped design the dot-dash alphabet and gave common letters like E the shortest codes.",'An early 1838 demonstration message read "A patient waiter is no loser."','Morse received US patent number 1,647 for his telegraph in 1840.',"International Morse, standardized in 1865, grew out of Friedrich Gerke's simplified version used on German railways.",'SOS was adopted at the 1906 Berlin radio conference. It does not stand for anything; the pattern was simply easy to send and recognize.','Before SOS, ships often sent CQD. The Titanic used both CQD and SOS in April 1912.','Titanic radio operator Jack Phillips kept sending distress calls until the power failed. The ship Carpathia rescued about 700 people.','On December 12, 1901, Marconi received the Morse letter S, three dots, across the Atlantic from Cornwall to Newfoundland.',"The first transatlantic telegraph cable, in 1858, carried Queen Victoria's greeting to President Buchanan. Sending it took over 16 hours.",'The word PARIS defines words per minute, because it takes exactly 50 time units to send.','Morse timing is simple: a dash lasts three dots, and the gap between letters lasts three dots.','In 1939, Ted McElroy copied Morse at 75.2 words per minute, a famous speed record.','Telegraph operators each had a personal "fist", a sending rhythm so unique that other operators could recognize them.','In WWII, Allied listening posts intercepted huge numbers of Morse messages from German radio operators.','Enigma machines scrambled the letters, but the encrypted text was still sent by radio in plain Morse code.','WWII radio operators learned to recognize enemy stations by their fist, which helped track units even when messages stayed unreadable.',"Resistance agents trained by Britain's SOE hid secret security checks in their Morse transmissions to show whether they were captured.","The BBC used Morse V, dot-dot-dot-dash, as a Victory signal in WWII. It echoes the opening notes of Beethoven's Fifth.",'In 1966, POW Jeremiah Denton blinked the word TORTURE in Morse code during a North Vietnamese TV interview.','The Zimmermann Telegram of 1917 was intercepted and decoded by British codebreakers, helping push the United States into WWI.','Warships still use flashing lamps to send Morse when radio silence is required.','Airplane navigation beacons identify themselves with Morse letters, so pilots can confirm they tuned the right station.','The US telegraph line reached California in October 1861, and the Pony Express shut down just days later.','Telegraph shorthand lives on: operators used 73 for "best regards" and 88 for "love and kisses".','Amateur radio operators have bounced Morse signals off the Moon and received their own echoes back.','The US ended its Morse test for amateur radio licenses in 2007.','In 1999, satellite-based GMDSS replaced Morse as the main way for ships to call for help.','Western Union sent its last telegram on January 27, 2006.','India closed its telegram service in 2013 after more than 160 years.','Morse can be tapped onto a hand, and some deaf-blind people use it to communicate by touch.','Google added a Morse code keyboard to Gboard in 2018, built with accessibility in mind.',"Morse's telegraph built on electromagnet work by scientist Joseph Henry.",'Morse can be sent by light, sound, radio, or tapping, so one code works with almost any signal.','Cooke and Wheatstone built an early needle telegraph in Britain in 1837, years before Morse\'s system spread.','Many languages have their own Morse alphabets, including Hebrew.','In Morse code, E is a single dot, the shortest letter, because it is the most common in English.','A skilled operator "copies" Morse by sound, hearing whole letters as rhythms instead
